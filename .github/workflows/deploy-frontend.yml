name: Deploy Frontend

on:
  push:
    branches: [main]
    paths: [frontend/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID || 'placeholder' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_CHAIN_ID: "5611"
          NEXT_PUBLIC_OPBNB_RPC: "https://opbnb-testnet-rpc.bnbchain.org"
          NEXT_PUBLIC_VAULT_FACTORY_ADDRESS: "0xEd871ed2D9281B175B42597b50748B9Ee8e951F7"
          NEXT_PUBLIC_VAULT_IMPL_ADDRESS: "0x671419bb5a8CeF7547f661212030F998B7992ACE"
          NEXT_PUBLIC_ZK_VERIFIER_ADDRESS: "0x05bcAB91C51104853f796F5D7bd57EF8077E904D"
          NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS: "0xD233dEbF4C760f93AA61C6fA7f668c19CA93aaC0"
          NEXT_PUBLIC_LTV_ORACLE_ADDRESS: "0x16165ad7A069Ada84F97a6311c9A62c700AC43d8"

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: --prod
