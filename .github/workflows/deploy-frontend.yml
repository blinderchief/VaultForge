name: Deploy Frontend

on:
  push:
    branches: [main]
    paths: [frontend/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          NEXT_PUBLIC_CHAIN_ID: "5611"
          NEXT_PUBLIC_VAULT_FACTORY_ADDRESS: ${{ secrets.NEXT_PUBLIC_VAULT_FACTORY_ADDRESS }}
          NEXT_PUBLIC_ZK_VERIFIER_ADDRESS: ${{ secrets.NEXT_PUBLIC_ZK_VERIFIER_ADDRESS }}
          NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS: ${{ secrets.NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS }}
          NEXT_PUBLIC_RELAYER_ADDRESS: ${{ secrets.NEXT_PUBLIC_RELAYER_ADDRESS }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: --prod
