name: Test Contracts

on:
  push:
    branches: [main]
    paths: [contracts/**]
  pull_request:
    branches: [main]
    paths: [contracts/**]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        working-directory: contracts
        run: forge build

      - name: Run tests
        working-directory: contracts
        run: forge test -vvv

      - name: Run coverage
        working-directory: contracts
        run: forge coverage
