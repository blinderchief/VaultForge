[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = false
ffi = false

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
opbnb_testnet = "${OPBNB_TESTNET_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[etherscan]
opbnb_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 5611 }
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97 }
